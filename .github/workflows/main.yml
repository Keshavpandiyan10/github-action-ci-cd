name: CI/CD Pipeline

on:
  push:
    branches: [master]

jobs:
  ci:
    runs-on: self-hosted

    steps:
      # FIX: This replaces git pull and downloads your code safely
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          path: /home/ubuntu/github-action-ci-cd

      - name: Install Dependencies
        run: |
          cd /home/ubuntu/github-action-ci-cd
          npm i

      - name: Run Test
        run: |
          cd /home/ubuntu/github-action-ci-cd
          npm run test

  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Restart App
        run: |
          pm2 restart index
